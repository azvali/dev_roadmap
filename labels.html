<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collab Page</title>
  </head>
  <body>
    <header>
      <h1>Collab Request</h1>
    </header>
    <form>
      <label>
        UserName:
        <input required name="userName" type="text" />
      </label>
      <label>
        Phone Number:
        <input required name="phoneNumber" type="tel" />
      </label>
      <label>
        Email
        <input required name="email" type="email" />
      </label>
      <label>
        Random Options
        <select name="options">
          <option value="">Select an Option</option>
          <option value="1">option 1</option>
          <option value="2">option 2</option>
          <option value="3">option 3</option>
          <option value="4">option 4</option>
          <option value="5">option 5</option>
        </select>
      </label>
      <label>
        Message
        <textarea name="message"></textarea>
      </label>
      <label>
        Current Date
        <input required name="currDate" type="date" />
      </label>
      <label>
        follower count
        <input required name="followCount" type="number" />
      </label>
      <label>
        page
        <input required name="pageLink" type="url" />
      </label>
      <button type="submit" style="width: 100px; height: 100px"></button>
    </form>
  </body>
</html>
